  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/png" href="assets/images/logo-icon.png">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .author-header {
      display: flex;
      gap: 1.75rem;
      align-items: center;
      flex-wrap: wrap;
      padding: 2.5rem 0 1.5rem;
    }

    .author-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .author-header h1 {
      margin: 0 0 0.35rem;
    }

    .author-role {
      color: var(--color-accent);
      font-weight: 600;
      margin: 0 0 0.75rem;
    }

    .author-bio {
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 640px;
      margin: 0;
    }

    .author-articles-section {
      padding: 1.5rem 0 4rem;
      border-top: 1px solid var(--color-border);
      margin-top: 1.5rem;
    }

    .author-articles-section h2 {
      font-size: 1.4rem;
      margin: 1.5rem 0 1.5rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header-brand">
      <a class="site-logo" href="index.html">
        <img src="assets/images/logo-icon.png" alt="" class="site-logo-icon">
        <img src="assets/images/logo-wordmark.png" alt="Panel Pixel" class="site-logo-wordmark">
      </a>
    </div>
    <div class="site-header-nav">
      <div class="container site-header-nav-inner">
        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">Menu</button>
        <nav class="primary-nav" id="primary-nav">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="recensioni.html">Recensioni</a>
          <a class="nav-link" href="monografie.html">Monografie</a>
          <a class="nav-link" href="attualita.html">Attualità</a>
          <a class="nav-link" href="anteprime.html">Anteprime</a>
          <a class="nav-link" href="approfondimenti.html">Approfondimenti</a>
          <a class="nav-link" href="chi-sono.html">Chi siamo</a>
          <a class="nav-link nav-link-account" href="account.html">Account</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="chi-sono.html">Chi siamo</a></li>
        <li aria-current="page" id="author-breadcrumb-name">Autore</li>
      </ol>
    </nav>

    <div id="author-page"></div>

    <section class="author-articles-section">
      <h2>Articoli</h2>
      <div class="card-grid" id="author-articles-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <p class="footer-brand"><img src="assets/images/logo-icon.png" alt="" class="footer-mark">&copy; 2026 Panel Pixel. Tutti i diritti riservati.</p>
      <p><a href="chi-sono.html">Chi siamo</a> · <a href="account.html">Redazione</a> · <a href="privacy.html">Privacy &amp; Cookie</a> · <a href="mailto:redazione@panelpixel.it">redazione@panelpixel.it</a></p>
    </div>
  </footer>
