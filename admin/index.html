<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel Pixel — Admin</title>
</head>
<body>
  <!-- Decap CMS legge automaticamente admin/config.yml (stessa cartella).
       Nessuna configurazione inline qui: tutto vive nel config.yml. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <!-- Parser markdown per l'anteprima live (Step C): la preview gira nel
       contesto di questa pagina, non dentro l'iframe — solo il CSS ci
       arriva via registerPreviewStyle in preview.js, il JS no. Stessa
       versione pinnata usata in articolo.html per il sito pubblicato. -->
  <script src="https://unpkg.com/marked@18.0.9/lib/marked.umd.js"></script>
  <!-- Personalizzazione di marked (renderer + componenti galleria/box),
       condivisa con articolo.html — deve caricare dopo marked.js e
       prima di preview.js, che chiama solo marked.parse(). -->
  <script src="../js/markdown-components.js"></script>
  <!-- Registra l'anteprima live della collection "articoli": deve caricare
       DOPO gli script CDN sopra, perché usa i globali che espongono
       (CMS, createClass, h, marked) — vedi admin/preview.js. -->
  <script src="preview.js"></script>
  <!-- Stile del form dell'editor: caricato per ULTIMO, dopo gli script
       sopra, di proposito. Decap inietta il proprio CSS via CSS-in-JS a
       runtime, quando i componenti montano — cioè DOPO che questa pagina
       ha finito il parsing iniziale. Un <link> messo prima (es. in <head>)
       viene quindi sovrascritto da regole con specificità comparabile
       inserite più tardi nel DOM: metterlo qui, alla fine, gli dà la
       precedenza nell'ordine di sorgente. Anche così non è garantito
       (vedi !important sulle proprietà cosmetiche in admin.css) — non è
       un'API ufficiale, vedi il commento in cima ad admin.css. -->
  <link rel="stylesheet" href="admin.css" />
</body>
</html>
