backend:
  name: git-gateway
  branch: main

# I collaboratori si autenticano via Netlify Identity (widget in
# admin/index.html), non più con un account GitHub diretto: Git Gateway
# fa da proxy verso il repo usando il token salvato lato Netlify, quindi
# nessun collaboratore riceve mai accesso diretto al codice. L'admin
# continua ad accedere con lo stesso account GitHub di oggi grazie al
# provider esterno GitHub configurato in Identity (dashboard Netlify,
# non in questo file). Attivazione di Identity/Git Gateway: manuale da
# dashboard Netlify, vedi nota in fondo a questo file.
publish_mode: editorial_workflow

# Cartella separata da assets/images/ (usata dagli articoli scritti/gestiti
# a mano) apposta: due convenzioni distinte e intenzionali per due flussi
# diversi, non un errore da unificare — entrambe risolvono correttamente
# dalla root del sito.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articoli"
    label: "Articoli"
    files:
      - name: "articoli"
        label: "Tutti gli articoli"
        file: "data/articles.json"
        fields:
          - label: "Articoli"
            name: "articles"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - label: "Titolo"
                name: "title"
                widget: "string"
              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "Usato nell'URL (articolo.html?slug=...). Solo minuscolo, numeri e trattini, es. il-mio-titolo."
              - label: "Categoria"
                name: "category"
                widget: "select"
                options:
                  - { label: "Recensioni", value: "recensioni" }
                  - { label: "Monografie", value: "monografie" }
                  - { label: "Attualità", value: "attualita" }
                  - { label: "Anteprime", value: "anteprime" }
                  - { label: "Approfondimenti", value: "approfondimenti" }
              - label: "Tipo"
                name: "type"
                widget: "select"
                hint: "Il tipo \"radar\" (rubrica a elenco voci) non è supportato da questo form: ha una struttura contenuto diversa dagli altri tre."
                options:
                  - { label: "Recensione", value: "recensione" }
                  - { label: "Monografia", value: "monografia" }
                  - { label: "Notizia", value: "notizia" }
              - label: "Sottotitolo / excerpt"
                name: "excerpt"
                widget: "text"
              - label: "Autore"
                name: "author"
                widget: "string"
                default: "Gianfranco Barry"
              - label: "Data"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                time_format: false
                picker_utc: true
              - label: "Immagine di copertina"
                name: "image"
                widget: "image"
              - label: "In evidenza in home"
                name: "featured"
                widget: "boolean"
                default: false
              - label: "Aspetto articolo (opzionale)"
                name: "theme"
                widget: "object"
                required: false
                collapsed: true
                hint: "Tutti i campi sono opzionali: un articolo senza nulla qui si comporta esattamente come oggi."
                fields:
                  - { label: "Colore sfondo (opzionale)", name: "background", widget: "color", required: false, allowInput: true }
                  - { label: "Colore accento (opzionale)", name: "accent", widget: "color", required: false, allowInput: true }
                  - { label: "Testo chiaro (per sfondi scuri)", name: "testoChiaro", widget: "boolean", default: false, required: false }
              - label: "Provato su (opzionale, solo recensioni)"
                name: "triedOn"
                widget: "string"
                required: false
                hint: "Es. \"PC (build review)\""
              - label: "SEO — Titolo"
                name: "seoTitle"
                widget: "string"
                required: false
                hint: "Con \" | Panel Pixel\" in fondo. Se lasciato vuoto, il sito genera un fallback dal titolo."
              - label: "SEO — Descrizione"
                name: "seoDescription"
                widget: "text"
                required: false
                hint: "140-160 caratteri. Se lasciato vuoto, il sito genera un fallback dal sottotitolo."
              - label: "SEO — Parole chiave"
                name: "seoKeywords"
                widget: "list"
                required: false
              - label: "Corpo dell'articolo"
                name: "content"
                widget: "markdown"
                hint: "Titoli limitati a H2/H3 dai bottoni qui sopra — livelli diversi digitati a mano vengono comunque normalizzati in fase di pubblicazione (vedi js/main.js). Per una didascalia sotto un'immagine, scrivi il testo tra virgolette dopo l'URL: ![alt](url \"didascalia\"). Un'immagine singola nel corpo è centrata e larga per default; per farla scorrere a destra o sinistra col testo intorno, aggiungi \"destra|\" o \"sinistra|\" all'inizio del testo alternativo: ![destra|alt](url) oppure ![sinistra|alt](url) — il prefisso non compare nell'alt effettivo. Per evidenziare una frase dentro un paragrafo (grassetto + colore d'accento), racchiudila tra doppio uguale: ==frase da evidenziare==. Per un colore diverso da quello di default, aggiungi il colore hex prima di un simbolo | dentro il doppio uguale: ==#2f7d4f|frase con colore libero==. Per un rimando a una nota a piè di pagina, scrivi [^1], [^2] ecc. nel testo dove serve, poi inserisci altrove nell'articolo il blocco \"Note a piè di pagina\" (bottone componenti editor) coi testi corrispondenti. Per un embed video YouTube o un post X/Twitter, usa il bottone \"Embed video/tweet\"."
                buttons: ["bold", "italic", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list", "link"]
                # "image" non è un valore valido per "buttons" (errore Decap
                # al primo giro: 'buttons[8]' must be equal to one of the
                # allowed values) — l'inserimento immagini nel widget
                # markdown è un "editor_components", opzione separata.
                # Elenco valori validi per "buttons" verificato sulla
                # documentazione ufficiale Decap CMS: bold, italic,
                # strikethrough, code, link, heading-one...heading-six,
                # quote, bulleted-list, numbered-list — "image" non c'è.
                # "gallery", "box" e "columns3" sono componenti
                # personalizzati, registrati via CMS.registerEditorComponent
                # in admin/preview.js (il rendering vero vive invece in
                # js/markdown-components.js, condiviso col sito pubblico).
                editor_components: ["image", "gallery", "box", "columns3", "footnotes", "embed"]

# Attivazione Identity/Git Gateway (manuale, da dashboard Netlify, NON da
# codice): 1) Identity > Enable Identity; 2) Identity > Registration >
# External providers > abilita GitHub (così l'admin continua a fare
# login col proprio account GitHub); 3) Identity > Services > Git
# Gateway > Enable Git Gateway. Finché questi passaggi non sono fatti,
# il login su account.html/admin non funziona: per questo queste
# modifiche non vanno in produzione prima dell'attivazione manuale.
