backend:
  name: github
  repo: barrygianfranco-ship-it/panelpixel-site
  branch: main

# Cartella separata da assets/images/ (usata dagli articoli scritti/gestiti
# a mano) apposta: due convenzioni distinte e intenzionali per due flussi
# diversi, non un errore da unificare — entrambe risolvono correttamente
# dalla root del sito.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articoli"
    label: "Articoli"
    files:
      - name: "articoli"
        label: "Tutti gli articoli"
        file: "data/articles.json"
        fields:
          - label: "Articoli"
            name: "articles"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - label: "Titolo"
                name: "title"
                widget: "string"
              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "Usato nell'URL (articolo.html?slug=...). Solo minuscolo, numeri e trattini, es. il-mio-titolo."
              - label: "Categoria"
                name: "category"
                widget: "select"
                options:
                  - { label: "Recensioni", value: "recensioni" }
                  - { label: "Monografie", value: "monografie" }
                  - { label: "Attualità", value: "attualita" }
                  - { label: "Anteprime", value: "anteprime" }
                  - { label: "Approfondimenti", value: "approfondimenti" }
              - label: "Tipo"
                name: "type"
                widget: "select"
                hint: "Il tipo \"radar\" (rubrica a elenco voci) non è supportato da questo form: ha una struttura contenuto diversa dagli altri tre."
                options:
                  - { label: "Recensione", value: "recensione" }
                  - { label: "Monografia", value: "monografia" }
                  - { label: "Notizia", value: "notizia" }
              - label: "Sottotitolo / excerpt"
                name: "excerpt"
                widget: "text"
              - label: "Autore"
                name: "author"
                widget: "string"
                default: "Gianfranco Barry"
              - label: "Data"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                time_format: false
                picker_utc: true
              - label: "Immagine di copertina"
                name: "image"
                widget: "image"
              - label: "In evidenza in home"
                name: "featured"
                widget: "boolean"
                default: false
              - label: "Provato su (opzionale, solo recensioni)"
                name: "triedOn"
                widget: "string"
                required: false
                hint: "Es. \"PC (build review)\""
              - label: "SEO — Titolo"
                name: "seoTitle"
                widget: "string"
                required: false
                hint: "Con \" | Panel Pixel\" in fondo. Se lasciato vuoto, il sito genera un fallback dal titolo."
              - label: "SEO — Descrizione"
                name: "seoDescription"
                widget: "text"
                required: false
                hint: "140-160 caratteri. Se lasciato vuoto, il sito genera un fallback dal sottotitolo."
              - label: "SEO — Parole chiave"
                name: "seoKeywords"
                widget: "list"
                required: false
              - label: "Corpo dell'articolo"
                name: "content"
                widget: "markdown"
                hint: "Titoli limitati a H2/H3 dai bottoni qui sopra — livelli diversi digitati a mano vengono comunque normalizzati in fase di pubblicazione (vedi js/main.js). Per una didascalia sotto un'immagine, scrivi il testo tra virgolette dopo l'URL: ![alt](url \"didascalia\")."
                buttons: ["bold", "italic", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list", "link"]
                # "image" non è un valore valido per "buttons" (errore Decap
                # al primo giro: 'buttons[8]' must be equal to one of the
                # allowed values) — l'inserimento immagini nel widget
                # markdown è un "editor_components", opzione separata.
                # Elenco valori validi per "buttons" verificato sulla
                # documentazione ufficiale Decap CMS: bold, italic,
                # strikethrough, code, link, heading-one...heading-six,
                # quote, bulleted-list, numbered-list — "image" non c'è.
                editor_components: ["image"]
