  <link rel="stylesheet" href="css/style.css">

  <style>
    .article-header {
      text-align: left;
    }

    .article-subtitle {
      color: var(--article-accent, var(--color-muted));
      font-size: 1.2rem;
      font-style: italic;
      line-height: 1.55;
      max-width: 680px;
      margin: 0 0 1.75rem;
    }

    .radar-period {
      color: var(--color-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: -0.75rem 0 1rem;
    }

    .article-header-divider {
      width: 100%;
      height: 1px;
      background: var(--article-accent, var(--color-border));
      margin: 0 0 2.5rem;
    }

    .article-heading {
      font-size: 1.3rem;
      margin: 2rem 0 1rem;
      clear: both;
    }

    .article-subheading {
      font-size: 1.1rem;
      margin: 1.75rem 0 0.85rem;
      clear: both;
    }

    .radar-list {
      list-style: none;
      margin: 0 0 2rem;
      padding: 0;
      border-top: 1px solid var(--color-border);
    }

    .radar-item {
      display: grid;
      grid-template-columns: 2.5rem 1fr;
      gap: 1rem;
      padding: 1.75rem 0;
      border-bottom: 1px solid var(--color-border);
    }

    .radar-item-index {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--color-accent);
    }

    .radar-item-title {
      font-size: 1.2rem;
      margin: 0 0 0.35rem;
    }

    .radar-item-meta {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin: 0 0 0.5rem;
    }

    .radar-item-release {
      font-size: 0.85rem;
      color: var(--color-muted);
      font-style: italic;
      margin: 0 0 0.6rem;
    }

    .radar-item-why {
      font-size: 1rem;
      line-height: 1.6;
      margin: 0;
    }

    .article-footer-meta {
      margin: 2rem 0 0;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-border);
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    .article-footer-standard {
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0 -1.25rem -1rem;
      padding: 0 1.25rem 1rem;
      display: flow-root;
    }

    .support-box {
      margin: 2rem 0 0;
      padding: 1.75rem;
      background: var(--color-bg-alt);
      border-radius: 4px;
    }

    .support-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin: 0 0 0.6rem;
    }

    .support-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-text);
      margin: 0 0 1rem;
    }

    .support-cta {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-accent);
      text-decoration: none;
    }

    .support-cta:hover {
      text-decoration: underline;
    }

    .comments-section {
      margin: 3rem 0 0;
      padding-top: 2.5rem;
      border-top: 1px solid var(--color-border);
    }

    .comments-title {
      font-size: 1.4rem;
      margin: 0 0 1.5rem;
    }

    .comments-placeholder {
      padding: 1.5rem;
      background: var(--color-bg-alt);
      border-radius: 4px;
      color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header-brand">

        <img src="assets/images/logo-icon.png" alt="" class="site-logo-icon">
        <img src="assets/images/logo-wordmark.png" alt="Panel Pixel" class="site-logo-wordmark">
      </a>
    </div>
    <div class="site-header-nav">
      <div class="container site-header-nav-inner">
        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">Menu</button>
        <nav class="primary-nav" id="primary-nav">
          <a class="nav-link" href="index.html">Home</a>

        </nav>
      </div>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs container" aria-label="Breadcrumb">
      <ol class="breadcrumb-list" id="breadcrumb-list"></ol>
    </nav>

    <article class="article-wrap" id="article-content">
      <div class="article-media" id="article-media"></div>
      <header class="article-header" id="article-header"></header>
      <div class="article-content-inner">
        <div class="article-body" id="article-body"></div>
        <ol class="radar-list" id="radar-list"></ol>
        <div class="article-footer-meta" id="article-footer-meta"></div>

        <div class="article-footer-standard" id="article-footer-standard">
          <div class="support-box" id="support-box"></div>
          <section class="comments-section" id="comments-section">
            <h2 class="comments-title">Commenti</h2>
            <div id="giscus-container"></div>
          </section>
        </div>
      </div>
    </article>

    <section class="read-next" id="read-next" hidden>
      <div class="container">
        <h2 class="section-title">Da leggere dopo</h2>
        <div class="card-grid" id="read-next-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">

      <p class="footer-brand"><img src="assets/images/logo-icon.png" alt="" class="footer-mark">&copy; 2026 Panel Pixel. Tutti i diritti riservati.</p>

    </div>
  </footer>

  <script src="js/main.js"></script>
